name: EAS Update

# Publica atualização OTA (apenas JS/assets). Disparo manual por enquanto:
# exige `expo-updates` instalado + `runtimeVersion` e `updates.url` no app.json
# (rode `eas update:configure`). Depois de configurar, descomente o push abaixo.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --legacy-peer-deps

      - name: Publicar update
        run: eas update --branch production --message "${{ github.event.head_commit.message || 'manual' }}" --non-interactive
